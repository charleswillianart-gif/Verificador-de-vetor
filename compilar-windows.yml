name: Compilar executável Windows

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Compilar aplicativo
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Verificador_de_vetor_Cromotransfer" --icon "assets/logo_icone.ico" --collect-all PySide6 --collect-all pymupdf --add-data "assets;assets" app_desktop.py

      - name: Criar pacote portátil ZIP
        run: Compress-Archive -Path "dist/Verificador_de_vetor_Cromotransfer.exe" -DestinationPath "dist/Verificador_Cromotransfer_Portatil.zip" -Force

      - name: Preparar Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Gerar instalador Windows
        run: iscc setup_windows.iss

      - name: Disponibilizar instalador, executável e ZIP portátil
        uses: actions/upload-artifact@v4
        with:
          name: Verificador_Cromotransfer_Windows
          path: |
            dist/Verificador_de_vetor_Cromotransfer.exe
            dist/Verificador_Cromotransfer_Portatil.zip
            dist/Verificador_Cromotransfer_Instalador.exe
          if-no-files-found: error
